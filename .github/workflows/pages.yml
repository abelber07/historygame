name: Recompilar el joc web

# GitHub Pages publica la branca main (arrel). Aquest workflow recompila
# index.html, historygame.apk i historygame.tar.gz quan canvia el codi o els assets, i els desa a main.
on:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: build-web
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instal·lar pygbag
        run: pip install pygbag==0.9.3

      - name: Compilar per a navegador (WebAssembly)
        run: |
          mkdir -p _web/historygame
          cp -r main.py assets _web/historygame/
          python -m pygbag --build --title "Invasió Alienígena" --icon favicon.png _web/historygame
          cp _web/historygame/build/web/index.html _web/historygame/build/web/historygame.apk _web/historygame/build/web/historygame.tar.gz .

      - name: Desar la versió compilada a main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html historygame.apk historygame.tar.gz
          if git diff --cached --quiet; then
            echo "Res a actualitzar"
          else
            git commit -m "Recompilar la versió web"
            git push
          fi

      - name: Demanar una nova publicació de GitHub Pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
