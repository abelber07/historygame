name: Publicar el joc a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instal·lar pygbag
        run: pip install pygbag==0.9.3

      - name: Compilar per a navegador (WebAssembly)
        run: |
          mkdir -p _web/invasio
          cp -r main.py assets _web/invasio/
          python -m pygbag --build --title "Invasió Alienígena" _web/invasio
          ls -la _web/invasio/build/web

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _web/invasio/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
